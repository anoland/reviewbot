name: 'Forgejo Test Effectiveness & Security Evaluator'
description: 'Automated PR evaluation of test suite effectiveness and security surface coverage powered by Gemini 2.5 Pro.'
author: 'Forgejo AI Bot'

inputs:
  gemini_api_key:
    description: 'Gemini API Key'
    required: true
  forgejo_token:
    description: 'Forgejo / GitHub Access Token'
    required: true
  custom_prompt_path:
    description: 'Optional path to custom system instruction prompt markdown file'
    required: false
    default: ''
  ref:
    description: 'Git branch or ref to scan when PR is not available (e.g. refs/heads/main or main)'
    required: false
    default: ''
  pr_number:
    description: 'Pull Request Number (optional if scanning a branch/ref directly)'
    required: false
    default: ''
  log_level:
    description: 'Log level verbosity: none, info, or debug'
    required: false
    default: 'info'

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - '--gemini-api-key'
    - '${{ inputs.gemini_api_key }}'
    - '--forgejo-token'
    - '${{ inputs.forgejo_token }}'
    - '--prompt-file'
    - '${{ inputs.custom_prompt_path }}'
    - '--ref'
    - '${{ inputs.ref }}'
    - '--pr-number'
    - '${{ inputs.pr_number }}'
    - '--log-level'
    - '${{ inputs.log_level }}'
